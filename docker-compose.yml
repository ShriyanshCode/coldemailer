# One command: `docker compose up --build`, then open http://localhost:8000 (or the PORT you set).
# The first start seeds 10,000 contacts; the database lives in the `state` volume, so it survives restarts.
# Run CLI commands against the same database with `docker compose exec app python -m coldemailer <command>`.
services:
  app:
    build: .
    image: coldemailer
    env_file:
      - path: .env          # optional: OPENROUTER_API_KEY etc. Without it, static templates + rule classifier.
        required: false
    environment:
      COLDEMAILER_DB: /app/state/coldemailer.db
    volumes:
      - state:/app/state
    ports:
      - "${PORT:-8000}:8000"   # PORT=8080 docker compose up, if 8000 is taken
    command: sh -c "test -f /app/state/coldemailer.db || python -m coldemailer seed; exec python -m coldemailer serve --host 0.0.0.0 --port 8000"

volumes:
  state:
